<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flowstate – Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <header class="topbar">
    <div class="fs-logo">flowstate</div>
    <div class="topbar-right">
      <a href="markets.html" class="btn-link">Markets</a>
      <a href="leaderboard.html" class="btn-link">Leaderboard</a>
      <span id="topbarUser"></span>
      <button id="logoutBtn" class="btn-ghost">Log out</button>
    </div>
  </header>

  <main class="dashboard-shell">
    <section class="balance-card">
      <h2>Your balance</h2>
      <p id="balanceText" class="balance-amount">$0</p>
      <p class="balance-sub">Everyone starts at $300 fake.</p>
    </section>

    <section class="markets-shell">
      <div class="markets-header">
        <h2>Markets</h2>
        <p class="muted">Debate outrounds from your league will show here.</p>
      </div>

      <div class="market-grid" id="marketGrid">
        <!-- markets rendered here from app.js -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
