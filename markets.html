<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flowstate – Markets</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-dark">
  <header class="topbar">
    <div class="fs-logo">flowstate</div>
    <div class="topbar-right">
      <a href="dashboard.html" class="btn-link">Dashboard</a>
      <a href="leaderboard.html" class="btn-link">Leaderboard</a>
      <span id="topbarUser"></span>
      <button id="logoutBtn" class="btn-ghost">Log out</button>
    </div>
  </header>

  <main class="markets-page">
    <section class="markets-shell">
      <div class="markets-header">
        <h2>Markets — Place bets</h2>
        <p class="muted">Use your balance to place bets. Bets are stored locally on this browser.</p>
      </div>

      <div id="marketsList" class="market-grid">
        <!-- markets rendered here from app.js -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
